<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess vs Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --light: #EBECD0; --dark: #739552; --bg: #302E2B; --panel: #262421;
    --border: #3D3A37; --green: #81B64C; --green-hover: #95CC5C;
    --text: #E8E6E3; --muted: #A09990;
  }
  body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }
  
  .navbar { background: var(--panel); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .logo { font-size: 22px; font-weight: 800; color: var(--green); letter-spacing: 1px; }
  .logo span { color: var(--text); }
  .nav-links a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: 600; }

  .game-area { display: flex; gap: 24px; padding: 24px; max-width: 1150px; margin: 0 auto; align-items: flex-start; justify-content: center; }
  .left-panel { flex: 0 0 auto; }
  .right-panel { flex: 1; max-width: 340px; min-width: 280px; background: var(--panel); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; height: 600px; }

  .player-info { display: flex; align-items: center; gap: 10px; padding: 10px 4px; min-height: 44px; }
  .player-info .avatar { width: 36px; height: 36px; border-radius: 4px; background: #4a4844; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .player-info .name { font-weight: 700; font-size: 14px; }
  .player-info .captured { display: flex; gap: 2px; margin-left: 8px; flex-wrap: wrap; }
  .player-info .captured img { width: 18px; height: 18px; opacity: 0.85; }
  .player-info .clock { margin-left: auto; background: #3a3733; padding: 6px 12px; border-radius: 4px; font-family: monospace; font-weight: 700; font-size: 16px; color: #fff; }
  .player-info .clock.active { background: #4a4844; }

  .board-wrapper { position: relative; width: 560px; height: 560px; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
  .square { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; touch-action: none; }
  .square.light { background: var(--light); }
  .square.dark  { background: var(--dark); }

  .square .piece { width: 92%; height: 92%; pointer-events: none; -webkit-user-drag: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
  .square .coord { position: absolute; font-size: 11px; font-weight: 700; pointer-events: none; opacity: 0.85; }
  .square .coord.file { bottom: 3px; right: 4px; }
  .square .coord.rank { top: 3px; left: 4px; }
  .square.light .coord { color: #6f8f4b; }
  .square.dark  .coord { color: #e8ecd0; }

  .square.last-move::before { content: ""; position: absolute; inset: 0; background: rgba(255, 241, 105, 0.5); pointer-events: none; }
  .square.selected::before { content: ""; position: absolute; inset: 0; background: rgba(255, 241, 105, 0.75); pointer-events: none; }
  .square.check::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,0.85) 0%, rgba(255,0,0,0.5) 60%, transparent 75%); pointer-events: none; }
  .square.legal::after { content: ""; position: absolute; width: 32%; height: 32%; border-radius: 50%; background: rgba(0,0,0,0.18); pointer-events: none; z-index: 2; }
  .square.legal.occupied::after { width: 100%; height: 100%; background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.22) 60%, rgba(0,0,0,0.22) 100%); border-radius: 0; }

  .dragging-piece { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5)); }

  .move-list { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .move-list-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px; color: var(--muted); text-transform: uppercase; }
  .move-list-content { flex: 1; overflow-y: auto; padding: 6px 4px; font-family: monospace; font-size: 14px; }
  .move-row { display: grid; grid-template-columns: 32px 1fr 1fr; padding: 0; }
  .move-row .cell { padding: 6px 8px; border-radius: 3px; }
  .move-row .move-number { color: var(--muted); font-weight: 700; padding: 6px 8px; }
  .move-row .move-notation { font-weight: 600; }
  .move-row .move-notation.current { background: rgba(129, 182, 76, 0.25); }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .controls button { padding: 10px; background: #454341; color: var(--text); border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.15s; }
  .controls button:hover { background: #5a5653; }
  .controls button.primary { background: var(--green); color: #1a1a1a; }
  .controls button.primary:hover { background: var(--green-hover); }
  .controls button.active-btn { background: #c0392b; color: white; }

  .square.hint-from::before { content: ""; position: absolute; inset: 0; background: rgba(155, 199, 0, 0.6); pointer-events: none; animation: pulse 0.9s ease-in-out infinite; }
  .square.hint-to::before { content: ""; position: absolute; inset: 0; background: rgba(255, 170, 0, 0.7); pointer-events: none; animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  .game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(38, 36, 33, 0.95); padding: 24px 36px; border-radius: 8px; text-align: center; display: none; z-index: 10; }
  .game-over.show { display: block; }
  .game-over .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .game-over .subtitle { color: var(--muted); margin-bottom: 16px; }

  .engine-status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 5; }
  .engine-status.show { display: block; }

  @media (max-width: 960px) {
    .game-area { flex-direction: column; align-items: center; padding: 12px; }
    .board-wrapper { width: min(560px, 92vw); height: min(560px, 92vw); }
    .right-panel { width: min(560px, 92vw); height: 400px; }
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">♟ CHESS<span>.ENGINE</span></div>
</div>

<div class="game-area">
  <div class="left-panel">
    <div class="player-info" id="topPlayer">
      <div class="avatar">🤖</div>
      <div class="name">Stockfish Engine</div>
      <div class="captured" id="capturedTop"></div>
      <div class="clock" id="clockTop">10:00</div>
    </div>

    <div class="board-wrapper">
      <div class="engine-status" id="engineStatus">Thinking...</div>
      <div class="board" id="board"></div>
      <div class="game-over" id="gameOver">
        <div class="title" id="gameOverTitle">Game Over</div>
        <div class="subtitle" id="gameOverSubtitle"></div>
        <button onclick="newGame()" style="padding:10px 24px;background:#81B64C;color:#1a1a1a;border:none;border-radius:4px;font-weight:700;cursor:pointer;">New Game</button>
      </div>
    </div>

    <div class="player-info" id="bottomPlayer">
      <div class="avatar">👤</div>
      <div class="name">You</div>
      <div class="captured" id="capturedBottom"></div>
      <div class="clock active" id="clockBottom">10:00</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="move-list">
      <div class="move-list-header">Moves</div>
      <div class="move-list-content" id="moveList"></div>
    </div>
    <div class="controls">
      <button class="primary" onclick="newGame()">New Game</button>
      <button onclick="undoMove()">Undo</button>
      <button onclick="flipBoard()">Flip</button>
      <button id="hintBtn" onclick="getHint()">Hint 💡</button>
      <button id="playEngineBtn" onclick="toggleEngine()" style="grid-column: span 2;">Play vs Computer: OFF</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. STOCKFISH ENGINE SETUP
   ============================================================ */
// CDN se Stockfish load karein (Ye background mein chalega)
const engine = new Worker('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');
let isEngineThinking = false;
let isHintMode = false;
let playVsEngine = false;
let engineDepth = 10; // Kitna deep sochana hai (10 = fast & strong)

engine.onmessage = function(event) {
  const line = event.data;
  
  // Jab engine apna best move bata de
  if (line.includes('bestmove')) {
    const moveStr = line.split(' ')[1]; // example: "e2e4"
    isEngineThinking = false;
    document.getElementById('engineStatus').classList.remove('show');

    if (moveStr && moveStr !== '(none)') {
      const from = moveStr.substring(0, 2);
      const to = moveStr.substring(2, 4);
      const promotion = moveStr.length > 4 ? moveStr.substring(4, 5) : 'q';

      if (isHintMode) {
        // HINT MODE: Sirf highlight karo, move mat karo
        hintSquares = { from: from, to: to };
        render();
        setTimeout(() => { hintSquares = null; render(); }, 3000);
        isHintMode = false;
      } else {
        // ENGINE MOVE: Computer ki taraf se move karo
        const result = game.move({ from: from, to: to, promotion: promotion });
        if (result) {
          lastMove = { from: result.from, to: result.to };
          selectedSquare = null; legalMoves = []; hintSquares = null;
          render(); updateMoveList();
        }
      }
    }
  }
};

// Engine ko trigger karein
function triggerEngine(isHint = false) {
  if (isEngineThinking || game.game_over()) return;
  
  isEngineThinking = true;
  isHintMode = isHint;
  document.getElementById('engineStatus').classList.add('show');
  document.getElementById('engineStatus').textContent = isHint ? "Calculating Hint..." : "Engine Thinking...";

  // Engine ko current board ki position bhejein
  engine.postMessage('position fen ' + game.fen());
  engine.postMessage('go depth ' + engineDepth);
}

// Hint button logic
function getHint() {
  if (game.turn() !== 'w' && !playVsEngine) {
    alert("Abhi aapki turn nahi hai!");
    return;
  }
  triggerEngine(true);
}

// Play vs Engine toggle
function toggleEngine() {
  playVsEngine = !playVsEngine;
  const btn = document.getElementById('playEngineBtn');
  if (playVsEngine) {
    btn.textContent = "Play vs Computer: ON";
    btn.classList.add('active-btn');
    // Agar user ne White khela aur abhi Black (engine) ki turn hai
    if (game.turn() === 'b') triggerEngine();
  } else {
    btn.textContent = "Play vs Computer: OFF";
    btn.classList.remove('active-btn');
  }
}

/* ============================================================
   2. CHESS GAME LOGIC & UI
   ============================================================ */
const PIECE_URL = (color, type) => `https://chessboardjs.com/img/chesspieces/wikipedia/${color}${type.toUpperCase()}.png`;

const game = new Chess();
let selectedSquare = null;
let legalMoves = [];
let lastMove = null;
let orientation = 'white';
let hintSquares = null;

let whiteTime = 600; 
let blackTime = 600;
let clockInterval = null;

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const files = ['a','b','c','d','e','f','g','h'];
  const ranks = ['8','7','6','5','4','3','2','1'];
  const dFiles = orientation === 'white' ? files : [...files].reverse();
  const dRanks = orientation === 'white' ? ranks : [...ranks].reverse();

  let checkSquare = null;
  if (game.in_check()) {
    const turn = game.turn();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = game.board()[r][c];
        if (p && p.type === 'k' && p.color === turn) checkSquare = 'abcdefgh'[c] + (8 - r);
      }
    }
  }

  dRanks.forEach((rank, rowIdx) => {
    dFiles.forEach((file, colIdx) => {
      const sq = file + rank;
      const isLight = (rowIdx + colIdx) % 2 === 0;
      const sqEl = document.createElement('div');
      sqEl.className = 'square ' + (isLight ? 'light' : 'dark');
      sqEl.dataset.square = sq;

      const piece = game.get(sq);
      if (piece) {
        const img = document.createElement('img');
        img.className = 'piece';
        img.src = PIECE_URL(piece.color, piece.type);
        sqEl.appendChild(img);
      }

      if (colIdx === 0) {
        const c = document.createElement('span'); c.className = 'coord rank'; c.textContent = rank; sqEl.appendChild(c);
      }
      if (rowIdx === 7) {
        const c = document.createElement('span'); c.className = 'coord file'; c.textContent = file; sqEl.appendChild(c);
      }

      if (lastMove && (sq === lastMove.from || sq === lastMove.to)) sqEl.classList.add('last-move');
      if (sq === selectedSquare) sqEl.classList.add('selected');
      if (sq === checkSquare) sqEl.classList.add('check');
      if (legalMoves.includes(sq)) {
        sqEl.classList.add('legal');
        if (piece) sqEl.classList.add('occupied');
      }
      if (hintSquares && (sq === hintSquares.from || sq === hintSquares.to)) sqEl.classList.add(sq === hintSquares.from ? 'hint-from' : 'hint-to');

      sqEl.addEventListener('click', () => onSquareClick(sq));
      sqEl.addEventListener('pointerdown', (e) => onPointerDown(e, sq));
      boardEl.appendChild(sqEl);
    });
  });

  updatePlayerInfo();
  checkGameOver();
}

function onSquareClick(sq) {
  // Agar engine soch raha hai ya computer ki turn hai, toh user move na kare
  if (isEngineThinking) return;
  if (playVsEngine && game.turn() === 'b') return;

  if (selectedSquare) {
    if (sq === selectedSquare) { clearSelection(); return; }
    if (legalMoves.includes(sq)) { makeMove(selectedSquare, sq); return; }
  }
  const piece = game.get(sq);
  if (piece && piece.color === game.turn()) {
    selectedSquare = sq;
    legalMoves = game.moves({ square: sq, verbose: true }).map(m => m.to);
    hintSquares = null;
    render();
  } else { clearSelection(); }
}

function clearSelection() {
  selectedSquare = null; legalMoves = []; hintSquares = null; render();
}

function onPointerDown(e, sq) {
  if (isEngineThinking) return;
  if (playVsEngine && game.turn() === 'b') return;

  const piece = game.get(sq);
  if (!piece || piece.color !== game.turn()) return;
  if (e.button !== undefined && e.button !== 0) return;
  
  e.preventDefault(); 

  selectedSquare = sq;
  legalMoves = game.moves({ square: sq, verbose: true }).map(m => m.to);
  hintSquares = null;
  render();

  const boardRect = document.getElementById('board').getBoundingClientRect();
  const sqSize = boardRect.width / 8;

  const dragImg = document.createElement('img');
  dragImg.src = PIECE_URL(piece.color, piece.type);
  dragImg.className = 'dragging-piece';
  dragImg.style.width = sqSize + 'px';
  dragImg.style.height = sqSize + 'px';
  dragImg.style.left = e.clientX + 'px';
  dragImg.style.top = e.clientY + 'px';
  document.body.appendChild(dragImg);

  const startSq = sq;
  let moved = false;

  const onMove = (ev) => { moved = true; dragImg.style.left = ev.clientX + 'px'; dragImg.style.top = ev.clientY + 'px'; };
  const onUp = (ev) => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    dragImg.remove();
    if (!moved) return;
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const targetSqEl = el && el.closest('.square');
    if (targetSqEl && targetSqEl.dataset.square !== startSq) makeMove(startSq, targetSqEl.dataset.square);
  };

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function makeMove(from, to) {
  const legal = game.moves({ square: from, verbose: true }).find(m => m.to === to);
  if (!legal) { clearSelection(); return; }
  const result = game.move({ from, to, promotion: 'q' });
  if (result) {
    lastMove = { from: result.from, to: result.to };
    selectedSquare = null; legalMoves = []; hintSquares = null;
    render(); updateMoveList(); startClockIfNeeded();

    // Agar Play vs Engine ON hai aur abhi Black (Engine) ki turn hai
    if (playVsEngine && game.turn() === 'b' && !game.game_over()) {
      setTimeout(() => triggerEngine(false), 300); // Thoda delay taaki UI update ho jaye
    }
  }
}

function newGame() {
  game.reset();
  selectedSquare = null; legalMoves = []; lastMove = null; hintSquares = null;
  whiteTime = 600; blackTime = 600;
  stopClock();
  document.getElementById('gameOver').classList.remove('show');
  render(); updateMoveList(); updateClocks();
}

function undoMove() {
  if (game.history().length === 0) return;
  game.undo();
  // Agar engine ke against khel rahe hain, toh 2 step undo karein (engine + aapka)
  if (playVsEngine && game.history().length > 0) game.undo();
  
  const h = game.history({ verbose: true });
  lastMove = h.length ? { from: h[h.length-1].from, to: h[h.length-1].to } : null;
  selectedSquare = null; legalMoves = []; hintSquares = null;
  render(); updateMoveList();
}

function flipBoard() { orientation = orientation === 'white' ? 'black' : 'white'; render(); }

function updateMoveList() {
  const hist = game.history({ verbose: true });
  const container = document.getElementById('moveList');
  container.innerHTML = '';
  for (let i = 0; i < hist.length; i += 2) {
    const row = document.createElement('div'); row.className = 'move-row';
    const num = document.createElement('div'); num.className = 'move-number'; num.textContent = (i/2 + 1) + '.'; row.appendChild(num);
    [hist[i], hist[i+1]].forEach((m, j) => {
      const cell = document.createElement('div'); cell.className = 'move-notation';
      if (m) { cell.textContent = m.san; if (i + j === hist.length - 1) cell.classList.add('current'); }
      row.appendChild(cell);
    });
    container.appendChild(row);
  }
  container.scrollTop = container.scrollHeight;
}

function updatePlayerInfo() {
  const cap = getCapturedPieces();
  const bottomIsWhite = orientation === 'white';
  const bottomCaptured = bottomIsWhite ? cap.w : cap.b;
  const topCaptured    = bottomIsWhite ? cap.b : cap.w;
  document.getElementById('capturedBottom').innerHTML = bottomCaptured.map(t => `<img src="${PIECE_URL(bottomIsWhite?'b':'w', t)}">`).join('');
  document.getElementById('capturedTop').innerHTML = topCaptured.map(t => `<img src="${PIECE_URL(bottomIsWhite?'w':'b', t)}">`).join('');
}

function getCapturedPieces() {
  const initial = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const cur = { w: { p:0,n:0,b:0,r:0,q:0 }, b: { p:0,n:0,b:0,r:0,q:0 } };
  for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) { const p = game.board()[r][c]; if (p && p.type !== 'k') cur[p.color][p.type]++; } }
  const captured = { w: [], b: [] };
  for (const t in initial) {
    const wGone = initial[t] - cur.w[t]; const bGone = initial[t] - cur.b[t];
    for (let i = 0; i < wGone; i++) captured.w.push(t);
    for (let i = 0; i < bGone; i++) captured.b.push(t);
  }
  return captured;
}

function startClockIfNeeded() {
  if (clockInterval) return;
  clockInterval = setInterval(() => {
    if (game.game_over()) { stopClock(); return; }
    if (game.turn() === 'w') whiteTime = Math.max(0, whiteTime - 1); else blackTime = Math.max(0, blackTime - 1);
    updateClocks();
    if (whiteTime === 0 || blackTime === 0) {
      stopClock(); const winner = whiteTime === 0 ? 'Black' : 'White'; showGameOver('Time out!', `${winner} wins on time`);
    }
  }, 1000);
}
function stopClock() { if (clockInterval) { clearInterval(clockInterval); clockInterval = null; } }
function updateClocks() {
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  document.getElementById('clockTop').textContent = fmt(orientation === 'white' ? blackTime : whiteTime);
  document.getElementById('clockBottom').textContent = fmt(orientation === 'white' ? whiteTime : blackTime);
}

function checkGameOver() {
  if (!game.game_over()) { document.getElementById('gameOver').classList.remove('show'); return; }
  stopClock();
  let title = 'Game Over', subtitle = '';
  if (game.in_checkmate()) { title = 'Checkmate!'; subtitle = (game.turn() === 'w' ? 'Black' : 'White') + ' wins'; }
  else if (game.in_stalemate()) { title = 'Stalemate'; subtitle = 'Draw'; }
  else if (game.in_draw()) { title = 'Draw'; subtitle = '50-move rule or repetition'; }
  showGameOver(title, subtitle);
}
function showGameOver(title, subtitle) {
  document.getElementById('gameOverTitle').textContent = title;
  document.getElementById('gameOverSubtitle').textContent = subtitle;
  document.getElementById('gameOver').classList.add('show');
}

render();
updateMoveList();
updateClocks();
</script>
</body>
</html>
